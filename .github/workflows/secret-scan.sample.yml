# SAMPLE: GitHub Actions Secret Scanning with TruffleHog

# DO NOT COMMIT - This is a sample workflow for secret scanning
# To enable:
# 1. Remove ".sample" from filename
# 2. Review and customize configuration
# 3. Test in a feature branch first

name: Secret Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  trufflehog-scan:
    runs-on: ubuntu-latest
    name: Scan for secrets with TruffleHog
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning
      
      - name: Run TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          # Scan the entire git history
          path: ./
          
          # Base branch to compare against (for PR scans)
          base: ${{ github.event.repository.default_branch }}
          
          # Head branch (current branch being scanned)
          head: HEAD
          
          # Additional flags
          extra_args: >
            --debug
            --only-verified
            --exclude-paths=trufflehog-exclude.txt
      
      - name: Upload scan results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog-results.json
      
      - name: Comment on PR (if secrets found)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Secret Scan Failed**\n\nTruffleHog detected potential secrets in this PR. Please review the scan results and remove any exposed credentials.\n\nSee the Actions tab for details.'
            })

# Optional: Create trufflehog-exclude.txt to exclude certain paths
# Example contents:
# node_modules/
# .git/
# *.lock
# package-lock.json
# dist/
# build/
# *.min.js
# docs/examples/  # Example code may contain fake credentials
